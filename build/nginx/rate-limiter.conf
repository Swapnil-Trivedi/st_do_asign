worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Two proxy replicas sharing Redis — round-robin proves multi-instance correctness.
  upstream rate_limiter_backends {
    server rate-limiter-a:8080;
    server rate-limiter-b:8080;
  }

  server {
    listen 8080;

    location /healthz {
      proxy_pass http://rate_limiter_backends;
    }

    location / {
      proxy_pass http://rate_limiter_backends;
    }
  }
}
