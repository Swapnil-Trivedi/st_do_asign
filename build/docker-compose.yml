# Local / CI compose stack.
# Services resolve each other by name on st_net (e.g. http://mock-server:8081).
name: st-do-asign

networks:
  st_net:
    name: st_net
    driver: bridge

services:
  mongo:
    image: mongo:7.0
    container_name: st-mongo
    networks:
      - st_net
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: rate_limiter
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-stroot}"
    volumes:
      - mongo_data:/data/db
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "stroot", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: st-redis
    networks:
      - st_net
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  control-plane:
    build:
      context: ..
      dockerfile: build/Dockerfile.control-plane
    image: st-do-asign/control-plane:local
    container_name: st-control-plane
    networks:
      - st_net
    ports:
      - "8091:8091"
    environment:
      CONTROL_PLANE_ADDR: "0.0.0.0:8091"
      MONGO_URI: "mongodb://root:stroot@mongo:27017/?authSource=admin"
      MONGO_DB: rate_limiter
      RATE_LIMITER_URL: "${RATE_LIMITER_URL:-http://rate-limiter:8080}"
      POLICY_POLL_INTERVAL: "${POLICY_POLL_INTERVAL:-2s}"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Two proxy replicas share Redis counters (multi-instance correctness).
  rate-limiter-a:
    build:
      context: ..
      dockerfile: build/Dockerfile.rate-limiter
    image: st-do-asign/rate-limiter:local
    container_name: st-rate-limiter-a
    networks:
      - st_net
    ports:
      - "18080:8080"
    environment:
      RATE_LIMITER_ADDR: "0.0.0.0:8080"
      INSTANCE_ID: "a"
      MONGO_URI: "mongodb://root:stroot@mongo:27017/?authSource=admin"
      MONGO_DB: rate_limiter
      REDIS_ADDR: "redis:6379"
      POLICY_POLL_INTERVAL: "2s"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rate-limiter-b:
    build:
      context: ..
      dockerfile: build/Dockerfile.rate-limiter
    image: st-do-asign/rate-limiter:local
    container_name: st-rate-limiter-b
    networks:
      - st_net
    ports:
      - "18081:8080"
    environment:
      RATE_LIMITER_ADDR: "0.0.0.0:8080"
      INSTANCE_ID: "b"
      MONGO_URI: "mongodb://root:stroot@mongo:27017/?authSource=admin"
      MONGO_DB: rate_limiter
      REDIS_ADDR: "redis:6379"
      POLICY_POLL_INTERVAL: "2s"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Public entrypoint — round-robin across rate-limiter-a/b.
  rate-limiter:
    build:
      context: ..
      dockerfile: build/Dockerfile.rate-limiter-lb
    image: st-do-asign/rate-limiter-lb:local
    container_name: st-rate-limiter
    networks:
      - st_net
    ports:
      - "8080:8080"
    depends_on:
      - rate-limiter-a
      - rate-limiter-b
    restart: unless-stopped

  mock-server:
    build:
      context: ..
      dockerfile: build/Dockerfile.mock-server
    image: st-do-asign/mock-server:local
    container_name: st-mock-server
    networks:
      - st_net
    ports:
      - "8081:8081"
    environment:
      MOCK_SERVER_ADDR: "0.0.0.0:8081"
    restart: unless-stopped

  vegeta-client:
    build:
      context: ..
      dockerfile: build/Dockerfile.vegeta-client
    image: st-do-asign/vegeta-client:local
    container_name: st-vegeta-client
    networks:
      - st_net
    ports:
      - "8090:8090"
    environment:
      VEGETA_CLIENT_ADDR: "0.0.0.0:8090"
      RATE_LIMITER_URL: "${RATE_LIMITER_URL:-http://rate-limiter:8080}"
    depends_on:
      - mock-server
      - rate-limiter
    restart: unless-stopped

  # Scratch image; orchestrates sibling services via Docker Engine API + docker.sock.
  console-api:
    build:
      context: ..
      dockerfile: build/Dockerfile.console-api
    image: st-do-asign/console-api:local
    container_name: st-console-api
    networks:
      - st_net
    ports:
      - "8095:8095"
    environment:
      CONSOLE_API_ADDR: "0.0.0.0:8095"
      PROJECT_ROOT: /project
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTROL_PLANE_URL: "http://control-plane:8091"
      RATE_LIMITER_URL: "http://rate-limiter:8080"
      MOCK_SERVER_URL: "http://mock-server:8081"
      VEGETA_URL: "http://vegeta-client:8090"
      E2E_POLICY_WAIT: "7s"
      E2E_VEGETA_POLL: "500ms"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/project:ro
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
